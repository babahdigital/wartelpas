<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segera Hadir - Babah Digital</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #27ae60;
            --text-color: #4a5568;
            --bg-color: #f4f7f6;
            --box-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            line-height: 1.7;
        }

        .container {
            background-color: var(--box-bg);
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            max-width: 550px;
            width: 100%;
            animation: floatIn 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes floatIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-wrapper {
            width: 70px;
            height: 70px;
            background-color: rgba(39, 174, 96, 0.1);
            color: var(--accent-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            margin: 0 auto 20px auto;
        }

        h1 {
            color: var(--primary-color);
            font-size: 26px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        p {
            font-size: 16px;
            margin-bottom: 20px;
        }

        .message {
            color: #718096;
            font-size: 15px;
            background-color: #f7fafc;
            padding: 15px;
            border-radius: 8px;
            border: 1px dashed #e2e8f0;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .container {
                padding: 40px 20px;
            }
            
            h1 {
                font-size: 22px;
            }
            
            p {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-wrapper">
            🚀
        </div>

        <h1>BABAH DIGITAL</h1>
        
        <p>Rumah baru kami sedang disiapkan. Kami sangat antusias untuk segera membagikan sesuatu yang luar biasa dengan Anda.</p>
        
        <div class="message">
            Situs ini sedang dalam tahap akhir pembangunan. Pantau terus untuk peluncuran resmi kami!
        </div>
    </div>

</body>
</html>
