# Wartelpas (hanya produksi): Cloudflare Tunnel -> nginx (lpsaring) -> wartelpas (:8081)
server {
    listen 80;
    server_name wartelpas.sobigidul.com wartelpas.babahdigital.net;

    client_max_body_size 20M;
    access_log /var/log/nginx/wartelpas_access.log;
    error_log /var/log/nginx/wartelpas_error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Request-ID $request_id always;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_pass http://10.10.83.2:8081;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
