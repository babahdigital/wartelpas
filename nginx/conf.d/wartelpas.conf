# Wartelpas (produksi): Cloudflare Tunnel -> global-nginx-proxy -> wartelpas (:80, internal Docker network)
server {
    listen 80;
    listen [::]:80;
    server_name wartelpas.babahdigital.net;

    resolver 127.0.0.11 ipv6=off valid=10s;

    client_max_body_size 20M;
    access_log /var/log/nginx/wartelpas_access.log;
    error_log /var/log/nginx/wartelpas_error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Request-ID $request_id always;

    if ($request_uri ~* "^(https?://|www\.)") {
        return 444;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        set $wartelpas_upstream wartelpas:80;
        proxy_pass http://$wartelpas_upstream;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
