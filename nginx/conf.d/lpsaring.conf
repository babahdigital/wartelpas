# Konfigurasi server utama lpsaring
server {
    listen 80;
    server_name lpsaring.babahdigital.net lpsaring.local localhost;

    # Pastikan header CSP hanya berasal dari Nginx (hindari duplikasi/konflik dari upstream).
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Content-Security-Policy-Report-Only;

    # Resolver Docker DNS agar upstream selalu ter-resolve ulang saat container restart
    resolver 127.0.0.11 ipv6=off valid=10s;

    # ----- AWAL KONFIGURASI REAL IP (Cloudflare Tunnel + Docker bridge) -----
    # Untuk stack nginx global + cloudflared, peer request ke nginx berasal dari jaringan Docker bridge.
    # Rentang ini sengaja cukup luas agar tetap stabil lintas host; setelah go-live bisa dipersempit
    # ke subnet aktual `proxy-network` dari `docker network inspect proxy-network`.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;

    # Pada Cloudflare Tunnel, header paling otoritatif untuk IP asli klien adalah CF-Connecting-IP.
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    # ----- AKHIR KONFIGURASI REAL IP -----

    client_max_body_size 10M;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss: ws:; frame-src https:; media-src 'self' https: blob:; object-src 'none'; base-uri 'self'; form-action 'self' https:; frame-ancestors 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Request-ID $request_id always;

    # Lokasi untuk API Backend
    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Request-ID $request_id;

        proxy_http_version 1.1;
        proxy_set_header Connection ""; 

        set $backend_upstream lpsaring-backend:5010;
        proxy_pass http://$backend_upstream;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Lokasi khusus untuk HMR/WebSocket Nuxt (Vite)
    location /_nuxt/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;

        set $frontend_upstream lpsaring-frontend:3010;
        proxy_pass http://$frontend_upstream;
        proxy_redirect off;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Lokasi default untuk Frontend Nuxt
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;

        set $frontend_upstream lpsaring-frontend:3010;
        proxy_pass http://$frontend_upstream;
        proxy_redirect off;
    }
}
